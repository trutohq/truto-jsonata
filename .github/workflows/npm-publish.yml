# Publishes @truto/truto-jsonata to npm.
#
# Two release lines share this one file:
#   main  -> the current major (3.x today), published to the `latest` dist-tag
#   2.x   -> the maintenance line for consumers still on the jsonata 2.0.6 engine,
#            published to the `v2` dist-tag
#
# The dist-tag is derived from the VERSION IN package.json, never from the branch name.
# That is deliberate: deriving it from the branch means a 2.x version accidentally landing
# on main would be published as `latest` and drag every consumer backwards. Deriving it
# from the version makes that impossible.

name: npm publish

# The run name carries the branch, so the two release lines are told apart at a
# glance in the Actions list. The resolved dist-tag lands in the job summary,
# because it is derived from the version and is not knowable until the job runs.
run-name: npm publish · ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - '2.x'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: yarn install --frozen-lockfile

      # Decide whether to publish at all, and under which dist-tag.
      - id: plan
        name: Resolve version and dist-tag
        run: |
          set -euo pipefail

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=${VERSION%%.*}

          echo "package=$NAME"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Already on the registry? Nothing to do. This makes a push to a release
          # branch that does not bump the version a clean no-op instead of a red build.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION is already published. Nothing to do."
            {
              echo "### npm publish — skipped"
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| branch | \`${{ github.ref_name }}\` |"
              echo "| package | \`$NAME@$VERSION\` |"
              echo "| reason | already on the registry |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          LATEST=$(npm view "$NAME" dist-tags.latest 2>/dev/null || echo "0.0.0")

          # `latest` only ever moves forward. Any version that does not sort above the
          # current `latest` goes to a major-scoped tag (v2, v3, ...) instead.
          HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | tail -1)
          if [ "$HIGHEST" = "$VERSION" ] && [ "$VERSION" != "$LATEST" ]; then
            TAG="latest"
          else
            TAG="v$MAJOR"
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing $NAME@$VERSION to dist-tag '$TAG' (current latest: $LATEST)"
          {
            echo "### npm publish — $NAME@$VERSION → \`$TAG\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| branch | \`${{ github.ref_name }}\` |"
            echo "| version | \`$VERSION\` |"
            echo "| dist-tag | \`$TAG\` |"
            echo "| latest before | \`$LATEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Belt and braces: a maintenance branch must never be able to claim `latest`,
      # even if the logic above is later changed.
      - name: Guard - maintenance branch cannot publish to latest
        if: steps.plan.outputs.publish == 'true' && github.ref != 'refs/heads/main' && steps.plan.outputs.tag == 'latest'
        run: |
          echo "::error::Refusing to publish ${{ steps.plan.outputs.version }} to 'latest' from ${{ github.ref }}."
          exit 1

      - name: Publish ${{ steps.plan.outputs.version }} to ${{ steps.plan.outputs.tag }}
        if: steps.plan.outputs.publish == 'true'
        run: npm publish --tag "${{ steps.plan.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
          CI: 'true'

      - name: Verify dist-tags
        if: steps.plan.outputs.publish == 'true'
        run: npm view "${{ steps.plan.outputs.package }}" dist-tags
